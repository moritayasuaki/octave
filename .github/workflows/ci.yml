name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup override set stable
      - name: Check Rust
        run: sh scripts/check.sh rust

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test minimum supported Rust
        run: |
          cargo +1.85.0 test --locked
          cargo +1.85.0 test --locked --no-default-features
          cargo +1.85.0 test --locked --no-default-features --features std
          cargo +1.85.0 test --locked --no-default-features --features os-rng

  lean:
    name: Lean proofs and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Lean version manager
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare local build directories
        run: sh scripts/prepare.sh
      - name: Fetch pinned Mathlib artifacts
        working-directory: lean
        run: lake exe cache get
      - name: Check proofs and native tests
        run: sh scripts/check.sh lean
      - name: Check fixture reproducibility
        run: |
          sh scripts/export-vectors.sh
          git diff --exit-code -- tests/fixtures/lean-vectors.txt lean/lake-manifest.json
